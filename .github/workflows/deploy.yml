name: Deploy to Pages

# How this works:
# 1. You push/upload an updated source file to the "staging" branch,
#    keeping its original name and folder path (e.g. 6_Cards_Sentences/Chinese_Cards_2.html).
# 2. This workflow copies it to its published name (index.html, rules.html, etc.)
#    and commits that straight to "main".
# 3. GitHub Pages already auto-publishes anything pushed to "main" — no extra step needed.
#
# No token is stored anywhere for this: it uses the ambient GITHUB_TOKEN that
# GitHub Actions generates automatically for every run, scoped only to this repo.
# The one manual, one-time requirement is enabling write access for that token:
# Settings -> Actions -> General -> Workflow permissions -> "Read and write permissions" -> Save.

on:
  push:
    branches:
      - staging

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout staging
        uses: actions/checkout@v4
        with:
          ref: staging
          path: staging

      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          path: main

      - name: Copy and rename files to their published names
        run: |
          set -e

          if [ -f "staging/6_Cards_Sentences/Chinese_Cards_2.html" ]; then
            cp "staging/6_Cards_Sentences/Chinese_Cards_2.html" "main/index.html"
            echo "Copied Chinese_Cards_2.html -> index.html"
          fi

          if [ -f "staging/3_Rules/Grammar Rules.html" ]; then
            cp "staging/3_Rules/Grammar Rules.html" "main/rules.html"
            echo "Copied Grammar Rules.html -> rules.html"
          fi

          for f in accordion.css accordion.js grammar-glossary.js video-data.js video-sidebar.js zh-glossary-data.js zh-hover-glossary.js; do
            if [ -f "staging/3_Rules/$f" ]; then
              cp "staging/3_Rules/$f" "main/$f"
              echo "Copied $f"
            fi
          done

      - name: Commit and push to main
        working-directory: main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "No changes to deploy."
          else
            git commit -m "Auto-deploy from staging ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            git push
          fi
