name: Validate and deploy to Firebase Hosting

on:
  push:
    branches: [main]
    paths:
      - index.html
      - rules.html
      - zh-rules-sync.js
      - package.json
      - package-lock.json
      - scripts/**
      - firebase.json
      - .firebaserc
      - .github/workflows/firebase-hosting.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firebase-hosting-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the published commit
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Check JavaScript syntax
        run: npm run lint

      - name: Validate source artifacts
        run: npm test

      - name: Build Firebase public directory
        run: npm run build

      - name: Validate deploy artifact
        run: npm run test:dist

      - name: Deploy the live Firebase Hosting channel
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: chinese-flashcards-6e922
          channelId: live
