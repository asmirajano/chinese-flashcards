<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#c0392b">
<title>中文 · 100 Sentences</title>
<style>
  :root{
    --red:#c0392b; --red-dark:#8e2a20; --ink:#232323; --muted:#6f6f6f;
    --bg1:#fbeeec; --bg2:#f4ded9; --line:#f0dcd7;
    --safe-t:env(safe-area-inset-top,0px);
    --safe-b:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html{-webkit-text-size-adjust:100%;}
  body{
    font-family:"Segoe UI",Roboto,system-ui,-apple-system,"Noto Sans SC",Arial,sans-serif;
    background:linear-gradient(165deg,var(--bg1),var(--bg2));
    color:var(--ink); line-height:1.5; min-height:100vh;
  }
  /* Sticky header */
  header{
    position:sticky; top:0; z-index:20;
    background:rgba(192,57,43,.97); color:#fff;
    padding:calc(10px + var(--safe-t)) 14px 10px; backdrop-filter:blur(6px);
    box-shadow:0 2px 12px rgba(120,30,22,.28);
  }
  .htop{display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .htitle{font-size:19px;font-weight:700;letter-spacing:1px;}
  .htitle small{font-weight:400;opacity:.85;font-size:13px;letter-spacing:0;}
  .count{font-size:13px;font-weight:600;background:rgba(255,255,255,.18);padding:5px 10px;border-radius:20px;white-space:nowrap;}
  .bar{height:6px;border-radius:6px;background:rgba(255,255,255,.25);margin-top:9px;overflow:hidden;}
  .bar>span{display:block;height:100%;width:0;background:#fff;transition:width .25s ease;}
  .controls{display:flex;gap:8px;margin-top:10px;}
  .ctrl{
    flex:1;min-height:40px;border:none;border-radius:11px;font-size:14px;font-weight:600;
    background:rgba(255,255,255,.16);color:#fff;cursor:pointer;transition:background .15s;
  }
  .ctrl:active{background:rgba(255,255,255,.32);}
  .ctrl.on{background:#fff;color:var(--red);}
  /* Collapsible options panel */
  .panel-toggle{
    width:100%;margin-top:9px;min-height:32px;border:none;border-radius:9px;
    background:rgba(255,255,255,.12);color:#fff;font-size:12.5px;font-weight:600;
    display:flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;
  }
  .panel-toggle:active{background:rgba(255,255,255,.22);}
  .chev{display:inline-block;transition:transform .2s ease;}
  .panel-toggle.open .chev{transform:rotate(180deg);}
  .controls-panel{max-height:0;overflow:hidden;transition:max-height .25s ease;}
  .controls-panel.open{max-height:400px;margin-top:8px;}
  /* List */
  main{max-width:640px;margin:0 auto;padding:14px 12px calc(30px + var(--safe-b));}
  .card{
    position:relative;background:#fff;border-radius:16px;margin-bottom:13px;
    box-shadow:0 4px 16px rgba(150,40,30,.10);
    border-left:5px solid var(--red);overflow:hidden;transition:opacity .2s,transform .2s;
    display:flex;flex-direction:column;
  }
  .top{padding:14px 14px 12px;border-bottom:1px solid var(--line);}
  .bottom{display:flex;align-items:stretch;}
  .main{flex:1 1 52%;min-width:0;padding:12px 13px;}
  .gloss{
    flex:1 1 48%;min-width:0;background:#fbeeec;border-left:1px dashed #e6c9c3;
    padding:12px 11px;display:flex;flex-direction:column;justify-content:center;gap:2px;
  }
  .gtitle{font-size:10px;text-transform:uppercase;letter-spacing:1.2px;color:#b07c74;margin-bottom:4px;}
  .grow{display:flex;flex-wrap:nowrap;align-items:baseline;gap:6px;padding:3px 0;border-bottom:1px solid #f2e2dd;}
  .grow:last-child{border-bottom:none;}
  .ghz{font-size:14px;font-weight:600;color:var(--ink);flex:0 0 auto;}
  .gpy{font-size:11.5px;font-weight:600;color:var(--red);flex:0 0 auto;}
  .gen{font-size:11.5px;color:#5f5f5f;flex:1 1 auto;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .head{display:flex;align-items:center;gap:9px;margin-bottom:7px;}
  .idx{font-size:12px;font-weight:700;color:var(--red);opacity:.8;line-height:1;}
  .test-label{
    display:inline-block;background:#ffe08a;color:#7a5b00;font-size:11px;font-weight:700;
    padding:3px 9px;border-radius:20px;margin-bottom:8px;
  }
  .emoji{
    font-size:17px;opacity:.5;filter:grayscale(15%);
    pointer-events:none;user-select:none;line-height:1;
  }
  .speak{
    margin-left:auto;flex:0 0 34px;height:34px;width:34px;border-radius:50%;border:none;
    background:linear-gradient(145deg,var(--red),var(--red-dark));color:#fff;font-size:15px;
    display:flex;align-items:center;justify-content:center;cursor:pointer;
    box-shadow:0 3px 8px rgba(192,57,43,.30);transition:transform .12s;
  }
  .speak:active{transform:scale(.92);}
  .speak.playing{background:linear-gradient(145deg,#e0685c,var(--red));animation:pulse 1s ease-in-out infinite;}
  @keyframes pulse{0%,100%{box-shadow:0 3px 8px rgba(192,57,43,.30);}50%{box-shadow:0 3px 14px rgba(192,57,43,.55);}}
  .sentence{display:flex;flex-wrap:wrap;gap:9px 11px;align-items:flex-end;}
  .word{display:flex;flex-direction:column;align-items:center;max-width:120px;}
  .py{font-size:17px;color:var(--red);font-weight:600;line-height:1.2;margin-bottom:1px;}
  .gw{
    display:none;font-size:12px;color:var(--muted);font-weight:600;font-style:italic;
    line-height:1.2;margin-bottom:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:120px;
  }
  .hz{font-size:20px;font-weight:600;color:var(--ink);line-height:1.1;}
  .punc{font-size:20px;color:var(--ink);align-self:flex-end;}
  .en{margin-top:0;color:var(--muted);font-size:16.5px;font-style:italic;}
  /* Display Mode: pinyin (default) vs English-per-word, above the hanzi row */
  .pinyinBtn{
    display:none;margin-top:10px;background:none;border:1px dashed var(--red);color:var(--red);
    font-size:11.5px;font-weight:700;padding:5px 11px;border-radius:8px;cursor:pointer;
  }
  .pinyinBtn:active{background:rgba(192,57,43,.08);}
  body.displaymode-english .py{display:none;}
  body.displaymode-english .gw{display:block;}
  body.displaymode-english .pinyinBtn{display:inline-block;}
  body.displaymode-english .card.pyrevealed .py{display:block;}
  body.displaymode-english .card.pyrevealed .gw{display:none;}
  body.displaymode-english .card.pyrevealed .pinyinBtn{display:none;}
  /* know toggle */
  .know{
    display:flex;align-items:center;gap:10px;margin-top:13px;padding-top:11px;
    border-top:1px solid var(--line);cursor:pointer;min-height:34px;user-select:none;
  }
  .box{
    flex:0 0 24px;height:24px;width:24px;border:2px solid #cdb7b2;border-radius:7px;
    display:flex;align-items:center;justify-content:center;transition:all .15s;
    font-size:16px;color:#fff;
  }
  .know .lbl{font-size:14px;color:var(--muted);font-weight:600;}
  .card.known{opacity:.5;}
  .card.known{border-left-color:#2e9e5b;}
  .card.known .box{background:#2e9e5b;border-color:#2e9e5b;}
  .card.known .lbl{color:#2e9e5b;}
  .card.known .lbl::after{content:" ✓";}
  /* hide-known mode */
  body.hideknown .card.known{display:none;}
  /* active-recall mode: hide English translation until revealed */
  .revealBtn{
    display:none;margin:6px 0 0;background:none;border:1px dashed var(--red);color:var(--red);
    font-size:11.5px;font-weight:700;padding:5px 11px;border-radius:8px;cursor:pointer;align-self:flex-start;
  }
  .revealBtn:active{background:rgba(192,57,43,.08);}
  body.recallmode .en{display:none;}
  body.recallmode .revealBtn{display:inline-block;}
  body.recallmode .card.revealed .en{display:block;}
  body.recallmode .card.revealed .revealBtn{display:none;}
  .empty{text-align:center;color:var(--muted);padding:40px 20px;font-size:15px;display:none;}
  footer{text-align:center;color:#a98d88;font-size:12px;padding:6px 16px calc(20px + var(--safe-b));}
  @media(min-width:560px){
    .sentence{gap:10px 14px;} .hz{font-size:22px;} .py{font-size:18px;}
  }
  /* keep gloss on the right of the bottom strip; only stack on ultra-narrow screens */
  @media(max-width:300px){
    .bottom{flex-direction:column;}
    .gloss{border-left:none;border-top:1px dashed #e6c9c3;}
  }
</style>
</head>

    <div class="controls" style="margin-top:8px;">

</header>

const listEl=document.getElementById('list');
const countEl=document.getElementById('count');
const barEl=document.getElementById('barfill');
const emptyEl=document.getElementById('empty');
const hideBtn=document.getElementById('toggleHide');
const resetBtn=document.getElementById('resetBtn');
const recallBtn=document.getElementById('toggleRecall');
const displayBtn=document.getElementById('toggleDisplayMode');
const pageBtn1=document.getElementById('pageBtn1');
const pageBtn2=document.getElementById('pageBtn2');
const panelToggle=document.getElementById('panelToggle');
const panelToggleLabel=document.getElementById('panelToggleLabel');
const controlsPanel=document.getElementById('controlsPanel');
const syncBtn=document.getElementById('syncBtn');

// Page 1 keeps its original (unsuffixed) storage keys so existing saved progress isn't lost.
// Page 2 gets its own suffixed keys so the two pages track progress independently.
const PAGE_DATA={1:DATA,2:DATA2};
function storageKey(base){ return currentPage===1 ? base+'_v1' : base+'_p2_v1'; }

function load(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v);}catch(e){return d;}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}

let currentPage=load('zh100_page_v1',1);
let known, hideMode, recallMode, displayMode;
let revealed=new Set(); // per-card "shown" state (translation) — deliberately NOT saved, resets each session
let pyRevealed=new Set(); // per-card "pinyin shown" state in english mode — NOT saved, resets each session
let fileHandle=null; // remembered Save-As file handle — reset whenever the page switches

function loadPageState(){
  known=new Set(load(storageKey('zh100_known'),[]));
  hideMode=load(storageKey('zh100_hide'),false);
  recallMode=load(storageKey('zh100_recall'),false);
  displayMode=load(storageKey('zh100_displaymode'),'pinyin');
  revealed=new Set();
  pyRevealed=new Set();
  fileHandle=null;
}
loadPageState();

// --- Cloud sync: same code on two devices = same "known" progress, near-real-time ---
let syncCode=load('zh100_synccode_v1',null);
let syncDocRef=null;
let unsubscribeSync=null;
let applyingRemote=false; // guards against our own pushes re-triggering a re-render loop

function applyRemoteData(data){
  const prefix=currentPage===1?'p1':'p2';
  applyingRemote=true;
  if(Array.isArray(data[prefix+'_known'])){ known=new Set(data[prefix+'_known']); save(storageKey('zh100_known'),[...known]); }
  if(typeof data[prefix+'_hide']==='boolean'){ hideMode=data[prefix+'_hide']; save(storageKey('zh100_hide'),hideMode); }
  if(typeof data[prefix+'_recall']==='boolean'){ recallMode=data[prefix+'_recall']; save(storageKey('zh100_recall'),recallMode); }
  if(typeof data[prefix+'_display']==='string'){ displayMode=data[prefix+'_display']; save(storageKey('zh100_displaymode'),displayMode); }
  render();
  applyingRemote=false;
}

function connectSync(){
  if(unsubscribeSync){ unsubscribeSync(); unsubscribeSync=null; }
  if(!syncCode){ syncDocRef=null; return; }
  syncDocRef=db.collection('sync').doc(syncCode);
  unsubscribeSync=syncDocRef.onSnapshot(doc=>{
    if(doc.exists) applyRemoteData(doc.data());
    else pushSync(); // first device with this code: seed the cloud with local state
  }, err=>console.warn('Cloud sync error:',err));
}

function pushSync(){
  if(!syncDocRef||applyingRemote) return;
  const prefix=currentPage===1?'p1':'p2';
  syncDocRef.set({
    [prefix+'_known']:[...known],
    [prefix+'_hide']:hideMode,
    [prefix+'_recall']:recallMode,
    [prefix+'_display']:displayMode,
    updatedAt:firebase.firestore.FieldValue.serverTimestamp()
  },{merge:true}).catch(err=>console.warn('Cloud sync push failed:',err));
}

function updateSyncBtn(){
  syncBtn.textContent=syncCode?'🔗 Cloud Sync: On':'🔗 Cloud Sync: Off';
  syncBtn.classList.toggle('on',!!syncCode);
}
function setupSyncCode(){
  const entered=prompt(
    syncCode
      ? `Cloud Sync is ON (code: "${syncCode}").\n\nEnter a different code to switch, or clear the box and press OK to turn sync off.`
      : 'Enter a sync code (use the exact same code on every device you want kept in sync):',
    syncCode||''
  );
  if(entered===null) return; // cancelled
  const trimmed=entered.trim();
  if(!trimmed){
    syncCode=null; save('zh100_synccode_v1',null);
    if(unsubscribeSync){ unsubscribeSync(); unsubscribeSync=null; }
    syncDocRef=null;
    updateSyncBtn();
    return;
  }
  if(trimmed.length<6){ alert('Please use a sync code of at least 6 characters.'); return; }
  syncCode=trimmed; save('zh100_synccode_v1',syncCode);
  connectSync();
  updateSyncBtn();
}
syncBtn.addEventListener('click',setupSyncCode);
updateSyncBtn();

function render(){
  listEl.innerHTML='';
  PAGE_DATA[currentPage].forEach((s,i)=>{
    const card=document.createElement('div');
    card.className='card'+(known.has(i)?' known':'')+(revealed.has(i)?' revealed':'')+(pyRevealed.has(i)?' pyrevealed':'');
    let sent='',rows='',plain='';
    const lastIdx=s.w.length-1;
    s.w.forEach(([hz,py],wi)=>{
      const suffix=(wi===lastIdx)?s.end:''; // fuse end punctuation onto last char so it can't wrap alone
      plain+=hz+suffix;
      if(py){
        const gw=GLOSS[hz]||'';
        sent+=`<span class="word"><span class="py">${py}</span><span class="gw">${gw}</span><span class="hz">${hz}${suffix}</span></span>`;
        rows+=`<div class="grow"><span class="ghz">${hz}</span><span class="gpy">${py}</span><span class="gen">${GLOSS[hz]||''}</span></div>`;
      } else sent+=`<span class="punc">${hz}${suffix}</span>`;
    });
    card.dataset.zh=plain;
    card.innerHTML=`
      <div class="top">
        ${s.label?`<div class="test-label">${s.label}</div>`:''}
        <div class="head">
          <span class="idx">${i+1}</span><span class="emoji">${s.e}</span>
          <button class="speak" data-i="${i}" aria-label="Play pronunciation">🔊</button>
        </div>
        <div class="sentence">${sent}</div>
        <button class="pinyinBtn" data-i="${i}">🔤 Show Pinyin</button>
      </div>
      <div class="bottom">
        <div class="main">
          <div class="en">${s.en}</div>
          <button class="revealBtn" data-i="${i}">👁 Show Translation</button>
          <div class="know" data-i="${i}">
            <span class="box">✓</span><span class="lbl">I know this</span>
          </div>
        </div>
        <div class="gloss"><div class="gtitle">Words</div>${rows}</div>
      </div>`;
    listEl.appendChild(card);
  });
  update();
}
function update(){
  const total=PAGE_DATA[currentPage].length;
  const n=known.size;
  countEl.textContent=`${n} / ${total} known`;
  barEl.style.width=(n/total*100)+'%';
  document.body.classList.toggle('hideknown',hideMode);
  hideBtn.classList.toggle('on',hideMode);
  hideBtn.textContent=hideMode?'Show all':'Hide known';
  document.body.classList.toggle('recallmode',recallMode);
  recallBtn.classList.toggle('on',recallMode);
  recallBtn.textContent=recallMode?'Show English Translation':'Hide English Translation';
  document.body.classList.toggle('displaymode-english',displayMode==='english');
  displayBtn.classList.toggle('on',displayMode==='english');
  displayBtn.textContent=displayMode==='english'?'Display Mode: English (tap for Pinyin)':'Display Mode: Pinyin (tap for English)';
  pageBtn1.classList.toggle('on',currentPage===1);
  pageBtn2.classList.toggle('on',currentPage===2);
  emptyEl.style.display=(hideMode && n===total)?'block':'none';
}
// --- speech (Web Speech API, built-in Chinese TTS voice) ---
let voices=[];
function loadVoices(){voices=window.speechSynthesis?speechSynthesis.getVoices():[];}
if('speechSynthesis' in window){
  loadVoices();
  speechSynthesis.onvoiceschanged=loadVoices;
}
function pickVoice(){
  return voices.find(v=>v.lang==='zh-CN')||voices.find(v=>v.lang&&v.lang.startsWith('zh'))||null;
}
function speak(text,btn){
  if(!('speechSynthesis' in window)){
    alert('Voice playback isn\'t supported in this browser.');return;
  }
  document.querySelectorAll('.speak.playing').forEach(b=>b.classList.remove('playing'));
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);
  u.lang='zh-CN'; u.rate=0.82; u.pitch=1;
  const v=pickVoice(); if(v)u.voice=v;
  if(btn){
    btn.classList.add('playing');
    u.onend=()=>btn.classList.remove('playing');
    u.onerror=()=>btn.classList.remove('playing');
  }
  speechSynthesis.speak(u);
}

listEl.addEventListener('click',e=>{
  const speakBtn=e.target.closest('.speak');
  if(speakBtn){
    const card=speakBtn.closest('.card');
    speak(card.dataset.zh,speakBtn);
    return;
  }
  const revealBtn=e.target.closest('.revealBtn');
  if(revealBtn){
    const i=+revealBtn.dataset.i;
    revealed.add(i);
    revealBtn.closest('.card').classList.add('revealed');
    return;
  }
  const pinyinBtn=e.target.closest('.pinyinBtn');
  if(pinyinBtn){
    const i=+pinyinBtn.dataset.i;
    pyRevealed.add(i);
    pinyinBtn.closest('.card').classList.add('pyrevealed');
    return;
  }
  const row=e.target.closest('.know'); if(!row)return;
  const i=+row.dataset.i;
  if(known.has(i))known.delete(i); else known.add(i);
  save(storageKey('zh100_known'),[...known]);
  row.closest('.card').classList.toggle('known',known.has(i));
  update();
  pushSync();
});
hideBtn.addEventListener('click',()=>{hideMode=!hideMode;save(storageKey('zh100_hide'),hideMode);update();pushSync();});
resetBtn.addEventListener('click',()=>{
  known.clear();save(storageKey('zh100_known'),[]);hideMode=false;save(storageKey('zh100_hide'),false);
  document.querySelectorAll('.card.known').forEach(c=>c.classList.remove('known'));
  update();
  pushSync();
});
recallBtn.addEventListener('click',()=>{
  recallMode=!recallMode;
  save(storageKey('zh100_recall'),recallMode);
  revealed.clear(); // fresh recall session: re-hide any translations shown before
  render();
  pushSync();
});
displayBtn.addEventListener('click',()=>{
  displayMode=(displayMode==='english')?'pinyin':'english';
  save(storageKey('zh100_displaymode'),displayMode);
  pyRevealed.clear(); // fresh session: re-hide any pinyin shown before
  render();
  pushSync();
});
function switchPage(p){
  if(p===currentPage)return;
  currentPage=p;
  save('zh100_page_v1',currentPage);
  loadPageState();
  render();
  if(syncDocRef){
    syncDocRef.get().then(doc=>{ if(doc.exists) applyRemoteData(doc.data()); }).catch(()=>{});
  }
}
pageBtn1.addEventListener('click',()=>switchPage(1));
pageBtn2.addEventListener('click',()=>switchPage(2));

// --- collapsible options panel (header was freezing ~half the screen on mobile) ---
let panelOpen=load('zh100_panel_open_v1',false);
function updatePanel(){
  controlsPanel.classList.toggle('open',panelOpen);
  panelToggle.classList.toggle('open',panelOpen);
  panelToggleLabel.textContent=panelOpen?'Hide options':'Show options';
}
panelToggle.addEventListener('click',()=>{
  panelOpen=!panelOpen;
  save('zh100_panel_open_v1',panelOpen);
  updatePanel();
});
updatePanel();

// --- manual backup/restore (works even if browser storage gets cleared) ---
const exportBtn=document.getElementById('exportBtn');
const importBtn=document.getElementById('importBtn');
const importFile=document.getElementById('importFile');

async function exportProgress(){
  const data={known:[...known],hideMode,page:currentPage,savedAt:new Date().toISOString()};
  const text=JSON.stringify(data,null,2);
  const suggestedName=currentPage===1?'zh100_progress.json':'zh100_progress_p2.json';

  if('showSaveFilePicker' in window){
    try{
      if(!fileHandle){
        fileHandle=await window.showSaveFilePicker({
          suggestedName,
          types:[{description:'Progress file',accept:{'application/json':['.json']}}]
        });
      }
      const writable=await fileHandle.createWritable();
      await writable.write(text);
      await writable.close();
      exportBtn.textContent='✅ Saved';
      setTimeout(()=>exportBtn.textContent='💾 Save progress file',1200);
      return;
    }catch(err){
      if(err && err.name==='AbortError')return; // user cancelled the picker
      fileHandle=null; // fall through to classic download below
    }
  }
  // Fallback for browsers without the Save-As picker (e.g. Firefox/Safari)
  const blob=new Blob([text],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url; a.download=suggestedName;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}
exportBtn.addEventListener('click',exportProgress);

importBtn.addEventListener('click',()=>importFile.click());
importFile.addEventListener('change',()=>{
  const file=importFile.files[0]; if(!file)return;
  const reader=new FileReader();
  reader.onload=()=>{
    try{
      const data=JSON.parse(reader.result);
      known=new Set(Array.isArray(data.known)?data.known:[]);
      hideMode=!!data.hideMode;
      save(storageKey('zh100_known'),[...known]); save(storageKey('zh100_hide'),hideMode);
      render();
      alert(`Loaded progress: ${known.size} known sentences.`);
    }catch(e){alert('That file could not be read as a progress backup.');}
  };
  reader.readAsText(file);
  importFile.value='';
});

render();
connectSync();
</script>
